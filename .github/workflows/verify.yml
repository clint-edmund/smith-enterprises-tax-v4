name: Verify Atlas

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and Verify
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
      VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}
      VITE_APP_ENVIRONMENT: ${{ vars.VITE_APP_ENVIRONMENT }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required environment variables
        shell: bash
        run: |
          required_variables=(
            VITE_APP_NAME
            VITE_APP_VERSION
            VITE_APP_ENVIRONMENT
            VITE_SUPABASE_URL
            VITE_SUPABASE_PUBLISHABLE_KEY
          )

          for variable in "${required_variables[@]}"; do
            if [ -z "${!variable}" ]; then
              echo "Missing required GitHub Actions variable: $variable"
              exit 1
            fi
          done

          echo "All required build variables are configured."

      - name: Verify Atlas
        run: ./scripts/verify-project.sh